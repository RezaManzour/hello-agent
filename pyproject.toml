[project]
name = "hello-agent"
version = "0.1.0"
description = "A from-scratch, test-driven LLM agent framework: tool calling, memory, RAG, MCP, multi-agent delegation, evaluation and guardrails"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Reza Manzour" }]
keywords = ["llm", "agents", "tool-calling", "rag", "mcp", "tdd"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
hello-agent = "hello_agent.main:main"

[project.urls]
Repository = "https://github.com/RezaManzour/hello-agent"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
